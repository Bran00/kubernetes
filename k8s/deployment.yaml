apiVersion: apps/v1
kind: Deployment
metadata:
  name: goserver
  labels:
    app: goserver
spec:
  selector:
    matchLabels:
      app: goserver
  replicas: 1
  template:
    metadata:
      labels:
        app: "goserver"
    spec:
      containers:
        - name: goserver
          image: "bran00/hello-go:v5.5"

          resources:
            requests:
              cpu:  "0.05"
              memory: 20Mi
            limits:
              cpu: "0.05"
              memory: 25Mi

          # startupProbe:
          #   httpGet:
          #     path: /healthz
          #     port: 8000
          #   periodSeconds: 3
          #   failureThreshold: 10
          #
          # readinessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: 8000
          #   periodSeconds: 8
          #   failureThreshold: 1
          #   # initialDelaySeconds: 15
          #
          # livenessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: 8000
          #   periodSeconds: 10
          #   failureThreshold: 1
          #   timeoutSeconds: 1
          #   successThreshold: 1
          #   # initialDelaySeconds: 20

          envFrom:
            - configMapRef:
                name: goserver-env
            - secretRef:
                name: goserver-secret

          volumeMounts:
            - mountPath: "/go/myfamily"
              name: config
              readOnly: true
            - mountPath: "/go/pvc"
              name: goserver-volume
      
      volumes:
        - name: goserver-pvc
          persistentVolumeClaim:
            claimName: goserver-pvc
        - name: config
          configMap:
            name: configmap-family
            items:
            - key: members
              path: "family.txt"
